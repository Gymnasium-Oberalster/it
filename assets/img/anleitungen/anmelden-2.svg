<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 0 460 700" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, Arial, sans-serif">
  <title>Begrüßungsbildschirm „Hallo“ mit markiertem Home-Button</title>
  <!-- iPad -->
  <rect x="392" y="63" width="48" height="11" rx="3" fill="#2b3345"/>
  <rect x="80" y="70" width="400" height="576" rx="36" fill="#1d2433"/>
  <rect x="85" y="75" width="390" height="566" rx="31" fill="none" stroke="#323b4f" stroke-width="2"/>
  <circle cx="280" cy="98" r="4" fill="#3a4357"/>
  <circle cx="280" cy="618" r="17" fill="none" stroke="#4a546a" stroke-width="3"/>
  <!-- Bildschirm -->
  <rect x="106" y="126" width="348" height="464" rx="4" fill="#b81ed0"/>
  <text x="116" y="141" font-size="9" fill="#fff">Gast  08:02  Montag 16. Sept.</text>
  <rect x="423" y="133" width="18" height="9" rx="2" fill="none" stroke="#fff" stroke-width="1.2"/>
  <rect x="425" y="135" width="11" height="5" rx="1" fill="#fff"/>

  <text x="280" y="200" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">Hallo</text>
  <text x="280" y="222" text-anchor="middle" font-size="11" fill="#fff">Deine Daten werden nach der Abmeldung nicht gesichert.</text>

  <circle cx="280" cy="388" r="62" fill="#fff" fill-opacity=".3"/>
  <circle cx="280" cy="368" r="20" fill="#fff" fill-opacity=".55"/>
  <path d="M244 428a36 30 0 0 1 72 0z" fill="#fff" fill-opacity=".55"/>
  <text x="280" y="412" text-anchor="middle" font-size="62" font-weight="800" fill="#dbeafe" fill-opacity=".9" letter-spacing="-1">iPad-502</text>

  <!-- Abbrechen -->
  <circle cx="138" cy="546" r="13" fill="#fff" fill-opacity=".4"/>
  <path d="M133 541l10 10M143 541l-10 10" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
  <text x="138" y="570" text-anchor="middle" font-size="8" fill="#fff" fill-opacity=".8">Abbrechen</text>

  <text x="280" y="572" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Zum Anmelden Home-Taste drücken</text>

  <!-- Markierung Home-Button -->
  <circle cx="280" cy="618" r="40" fill="none" stroke="#22c55e" stroke-opacity=".35" stroke-width="3"/>
  <circle cx="280" cy="618" r="29" fill="none" stroke="#22c55e" stroke-width="5"/>
</svg>
