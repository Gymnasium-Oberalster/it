<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 0 460 700" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, Arial, sans-serif">
  <title>Sperrbildschirm im Gast-Modus: Taste oben am iPad (a, b) und Schaltfläche „Abmelden“ unten rechts (c) sind markiert</title>
  <!-- iPad -->
  <rect x="392" y="63" width="48" height="11" rx="3" fill="#2b3345"/>
  <rect x="80" y="70" width="400" height="576" rx="36" fill="#1d2433"/>
  <rect x="85" y="75" width="390" height="566" rx="31" fill="none" stroke="#323b4f" stroke-width="2"/>
  <circle cx="280" cy="98" r="4" fill="#3a4357"/>
  <circle cx="280" cy="618" r="17" fill="none" stroke="#4a546a" stroke-width="3"/>
  <!-- Bildschirm -->
  <rect x="106" y="126" width="348" height="464" rx="4" fill="#e01cc4"/>
  <text x="116" y="141" font-size="9" fill="#fff">Gast</text>
  <rect x="423" y="133" width="18" height="9" rx="2" fill="none" stroke="#fff" stroke-width="1.2"/>
  <rect x="425" y="135" width="15" height="5" rx="1" fill="#fff"/>

  <text x="280" y="222" text-anchor="middle" font-size="76" font-weight="200" fill="#fff">05:32</text>
  <text x="280" y="248" text-anchor="middle" font-size="13" fill="#fff">Montag, 16. September</text>

  <circle cx="280" cy="410" r="58" fill="#fff" fill-opacity=".28"/>
  <text x="280" y="434" text-anchor="middle" font-size="62" font-weight="800" fill="#f1f5f9" fill-opacity=".9" letter-spacing="-1">iPad-515</text>

  <text x="270" y="572" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Zum Öffnen Home-Taste drücken</text>

  <!-- Abmelden -->
  <circle cx="420" cy="546" r="15" fill="#fff" fill-opacity=".4"/>
  <path d="M414 540l12 12M426 540l-12 12" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
  <text x="420" y="574" text-anchor="middle" font-size="9" fill="#fff">Abmelden</text>

  <!-- Markierung Taste oben (a, b) -->
  <rect x="380" y="52" width="72" height="34" rx="17" fill="none" stroke="#22c55e" stroke-width="5"/>
  <g font-size="20" font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="394" cy="28" r="17" fill="#22c55e"/>
    <text x="394" y="35">a</text>
    <circle cx="438" cy="28" r="17" fill="#22c55e"/>
    <text x="438" y="35">b</text>
  </g>

  <!-- Markierung Abmelden (c) -->
  <circle cx="420" cy="552" r="40" fill="none" stroke="#22c55e" stroke-opacity=".35" stroke-width="3"/>
  <circle cx="420" cy="552" r="30" fill="none" stroke="#22c55e" stroke-width="5"/>
  <circle cx="368" cy="506" r="17" fill="#22c55e" stroke="#fff" stroke-width="2.5"/>
  <text x="368" y="513" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">c</text>
</svg>
