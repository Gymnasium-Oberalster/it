<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 0 460 700" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, Arial, sans-serif">
  <title>Sperrbildschirm des iPads mit markierter Schaltfläche „Gast“ unten rechts</title>
  <!-- iPad -->
  <rect x="392" y="63" width="48" height="11" rx="3" fill="#2b3345"/>
  <rect x="80" y="70" width="400" height="576" rx="36" fill="#1d2433"/>
  <rect x="85" y="75" width="390" height="566" rx="31" fill="none" stroke="#323b4f" stroke-width="2"/>
  <circle cx="280" cy="98" r="4" fill="#3a4357"/>
  <circle cx="280" cy="618" r="17" fill="none" stroke="#4a546a" stroke-width="3"/>
  <!-- Bildschirm -->
  <rect x="106" y="126" width="348" height="464" rx="4" fill="#b81ed0"/>
  <text x="116" y="141" font-size="9" fill="#fff">08:02  Montag 16. Sept.</text>
  <rect x="423" y="133" width="18" height="9" rx="2" fill="none" stroke="#fff" stroke-width="1.2"/>
  <rect x="425" y="135" width="11" height="5" rx="1" fill="#fff"/>

  <text x="280" y="196" text-anchor="middle" font-size="13" fill="#fff">Zum Fortfahren mit deiner</text>
  <text x="280" y="213" text-anchor="middle" font-size="13" fill="#fff">Apple-ID anmelden</text>
  <path d="M146 234h268M146 264h268" stroke="#fff" stroke-opacity=".35" stroke-width="1"/>
  <text x="150" y="253" font-size="11" font-weight="600" fill="#fff">Apple-ID</text>
  <text x="206" y="253" font-size="11" fill="#fff" fill-opacity=".5">example@icloud.com</text>
  <text x="280" y="290" text-anchor="middle" font-size="12" fill="#fff" fill-opacity=".55">Anmelden</text>

  <text x="280" y="430" text-anchor="middle" font-size="62" font-weight="800" fill="#dbeafe" letter-spacing="-1">iPad-502</text>

  <text x="262" y="566" text-anchor="middle" font-size="7" fill="#fff" fill-opacity=".6">Dieses iPad wird von „Gymnasium Oberalster“ verwaltet.</text>

  <!-- Gast -->
  <circle cx="420" cy="546" r="15" fill="#fff" fill-opacity=".4"/>
  <circle cx="420" cy="541" r="4.5" fill="#fff"/>
  <path d="M411 554a9 7.5 0 0 1 18 0z" fill="#fff"/>
  <text x="420" y="574" text-anchor="middle" font-size="9" fill="#fff">Gast</text>

  <!-- Markierung -->
  <circle cx="420" cy="552" r="40" fill="none" stroke="#22c55e" stroke-opacity=".35" stroke-width="3"/>
  <circle cx="420" cy="552" r="30" fill="none" stroke="#22c55e" stroke-width="5"/>
</svg>
